# Sentinel's conservative defaults are suitable for authorized, low-impact checks.
timeout_seconds: 8
concurrency: 4
rate_limit_per_second: 1
verify_tls: true
ports: [80, 443, 8080, 8443, 8000, 3000, 5000, 22]
enable_port_scan: true
enable_banner_grab: false
enable_passive_subdomains: false
enable_whois: false
enable_email_security: true
enable_takeover_check: false
enable_public_api_probe: false
enable_public_artifact_checks: false
enable_content_discovery: false
max_directory_requests: 50
max_sitemap_urls: 100
max_js_files: 10
# The crawler is opt-in, same-host, GET-only, and skips parsed robots Disallow paths.
enable_safe_crawl: false
max_crawl_pages: 20
max_crawl_depth: 2
allow_private: false

# External tools are trusted local binaries invoked only when enabled.
# Install them on PATH and review their flags before turning these on.
enable_subfinder: false
enable_amass: false
enable_nmap: false
enable_nuclei: false
enable_ffuf: false
external_timeout_seconds: 300
subfinder_args: "-silent"
amass_args: "-passive"
nmap_args: "-sV -Pn -T3"
nuclei_args: "-silent"
nuclei_severity: "low,medium,high,critical"
nuclei_tags: "exposure,misconfig"
# nuclei_templates: "/path/to/your/templates"
ffuf_args: "-noninteractive"
# ffuf_wordlist_path: "/path/to/your/wordlist.txt"
ffuf_match_codes: "200,204,301,302,307,308,401,403"

profiles:
  passive:
    enable_port_scan: false
    enable_passive_subdomains: true
    enable_whois: true
    enable_takeover_check: true
  local-lab:
    allow_private: true
    rate_limit_per_second: 2
    enable_port_scan: true
