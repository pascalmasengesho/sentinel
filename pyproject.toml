[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sentinel-bounty"
dynamic = ["version"]
description = "A safe, rate-limited assistant for authorized web security assessments."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Sentinel contributors" }]
keywords = ["security", "bug-bounty", "reconnaissance", "authorized-testing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "dnspython>=2.6,<3",
  "httpx>=0.27,<1",
  "PyYAML>=6.0,<7",
  "rich>=13.7,<14",
  "typer>=0.12,<1",
  "python-whois>=0.9,<1",
  "cryptography>=42,<46",
  "reportlab>=4.2,<5",
]

[project.optional-dependencies]
dev = [
  "black>=24.4,<26",
  "build>=1.2,<2",
  "mypy>=1.10,<2",
  "pytest>=8.2,<9",
  "pytest-asyncio>=0.23,<2",
  "ruff>=0.5,<1",
  "twine>=5,<7",
]

[project.scripts]
sentinel = "sentinel.cli:app"

[project.urls]
Documentation = "https://github.com/pascalmasengesho/sentinel#readme"
Issues = "https://github.com/pascalmasengesho/sentinel/issues"
Source = "https://github.com/pascalmasengesho/sentinel"

[tool.hatch.version]
path = "sentinel/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["sentinel"]

[tool.hatch.build.targets.sdist]
include = [
  "/sentinel",
  "/tests",
  "/docs",
  "/examples",
  "/LICENSE",
  "/README.md",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/CODE_OF_CONDUCT.md",
  "/SECURITY.md",
  "/sentinel.example.yaml",
]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
lint.select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
exclude = ["tests"]

[[tool.mypy.overrides]]
module = ["yaml", "whois", "reportlab.*"]
ignore_missing_imports = true
